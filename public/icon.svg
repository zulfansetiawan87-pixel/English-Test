<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="orangeAccent" x1="200" y1="200" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#shieldGrad)"/>
  <!-- Outer Shield Border -->
  <path d="M256 72L112 136V264C112 358 174 444 256 468C338 444 400 358 400 264V136L256 72Z" stroke="url(#blueGlow)" stroke-width="20" stroke-linejoin="round" fill="#0F172A" fill-opacity="0.6"/>
  <!-- Lock / Secure Element -->
  <rect x="196" y="240" width="120" height="96" rx="20" fill="url(#blueGlow)"/>
  <path d="M220 240V196C220 176 236 160 256 160C276 160 292 176 292 196V240" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>
  <!-- Checkmark in Orange -->
  <path d="M232 288L248 304L282 270" stroke="url(#orangeAccent)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkles -->
  <circle cx="370" cy="140" r="12" fill="#FB923C"/>
  <circle cx="140" cy="380" r="8" fill="#38BDF8"/>
</svg>
